<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- First paint stays covered until React's language loader is mounted. -->
    <style>
      html { background: #1d1f1e; }
      html[data-theme="light"] { background: #c5c5c5; }
      #bootstrap-loader { display: none; }
      html[data-app-booting] #root { visibility: hidden; }
      html[data-app-booting] #bootstrap-loader { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center; background: #1d1f1e; color: #fff; font-family: system-ui, sans-serif; }
      html[data-theme="light"][data-app-booting] #bootstrap-loader { background: #c5c5c5; color: #202a3d; }
      #bootstrap-loader .boot-greeting { display: flex; align-items: center; gap: 12px; font-size: clamp(2.25rem, 4.75vw, 6rem); font-weight: 300; }
      #bootstrap-loader .boot-dot { width: 8px; height: 8px; border-radius: 50%; background: #d63a45; }
      html[data-theme="light"] #bootstrap-loader .boot-dot { background: #315cff; }
      #bootstrap-loader .boot-cue { position: absolute; left: 24px; bottom: 24px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
      @media (max-width: 600px) { #bootstrap-loader .boot-cue { top: 24px; bottom: auto; } }
    </style>
    <script>
      document.documentElement.setAttribute('data-app-booting', '');
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
      } catch { /* Storage may be unavailable; use the default theme. */ }
      window.__portfolioBootTimer = setTimeout(() => {
        document.documentElement.removeAttribute('data-app-booting');
      }, 12000);
    </script>

    <!-- Primary SEO -->
    <title>
      Renzil Rodrigues — Technical Architect & Systems Builder
    </title>
    <meta

    />

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
